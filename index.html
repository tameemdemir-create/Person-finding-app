<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PERSON TRACKER | الكاميرا الذكية</title>
    <style>
        :root {
            color-scheme: dark;
            --black: #030704;
            --surface: #09120b;
            --panel: #0c180f;
            --green: #39f27a;
            --soft-green: #b5f7c8;
            --muted-green: #74b986;
            --border-green: #1c6736;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 18px;
            background: radial-gradient(ellipse at 10% 0%, #10331b 0, var(--black) 48%);
            color: var(--soft-green);
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        }
        main { max-width: 820px; margin: auto; }
        .hero {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
        }
        .brand-mark {
            display: grid;
            width: 58px;
            height: 58px;
            flex: 0 0 58px;
            place-items: center;
            border: 1px solid var(--green);
            border-radius: 18px;
            background: linear-gradient(145deg, #123b20, var(--surface));
            color: var(--green);
            font-size: 19px;
            font-weight: 900;
            box-shadow: 0 0 28px #39f22722;
        }
        .hero-copy { flex: 1; }
        .eyebrow {
            margin: 0 0 4px;
            color: var(--green);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
        }
        h1 { margin: 0; color: var(--soft-green); font-size: clamp(22px, 5vw, 32px); }
        .hero-copy p:last-child { margin: 6px 0 0; color: var(--muted-green); }
        .live-chip {
            padding: 9px 12px;
            border: 1px solid var(--border-green);
            border-radius: 999px;
            background: var(--surface);
            color: var(--green);
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }
        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-inline-end: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px var(--green);
        }
        section {
            margin-top: 16px;
            padding: clamp(16px, 4vw, 24px);
            border: 1px solid var(--border-green);
            border-radius: 20px;
            background: linear-gradient(145deg, #0d1b11, var(--surface));
            box-shadow: 0 18px 55px #00000066;
        }
        .section-heading { margin: 0 0 16px; color: var(--green); font-size: 17px; }
        label { display: block; color: var(--soft-green); font-size: 14px; font-weight: 700; }
        video {
            display: block;
            width: 100%;
            max-height: 70vh;
            min-height: 220px;
            margin-top: 18px;
            background: var(--black);
            border: 1px solid var(--border-green);
            border-radius: 16px;
            box-shadow: inset 0 0 28px #00000088;
        }
        button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border: 1px solid var(--green);
            border-radius: 12px;
            color: var(--black);
            background: var(--green);
            font: inherit;
            font-weight: 800;
            transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
            cursor: pointer;
        }
        button:hover:not(:disabled) {
            transform: translateY(-1px);
            background: var(--soft-green);
            box-shadow: 0 8px 22px #39f22722;
        }
        button:disabled { opacity: .55; cursor: wait; }
        button.secondary {
            border-color: var(--border-green);
            color: var(--green);
            background: var(--black);
        }
        input {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            border: 1px solid var(--border-green);
            border-radius: 12px;
            outline: none;
            background: var(--black);
            color: var(--soft-green);
            font: inherit;
            direction: ltr;
            text-align: left;
        }
        input:focus { border-color: var(--green); box-shadow: 0 0 0 3px #39f22722; }
        #status {
            margin: 14px 0 0;
            padding: 12px 14px;
            border: 1px solid var(--border-green);
            border-radius: 12px;
            background: var(--black);
            color: var(--muted-green);
            line-height: 1.7;
            overflow-wrap: anywhere;
        }
        #status.error { color: var(--soft-green); border-color: var(--green); }
        #status.ready { color: var(--green); }
        @media (max-width: 560px) {
            body { padding: 20px 13px; }
            .hero { gap: 11px; }
            .brand-mark { width: 48px; height: 48px; flex-basis: 48px; border-radius: 15px; }
            .live-chip { padding: 8px; font-size: 9px; }
            video { min-height: 180px; }
        }
    </style>
</head>
<body>
<main>
    <header class="hero">
        <div class="brand-mark" aria-hidden="true">PF</div>
        <div class="hero-copy">
            <p class="eyebrow">PERSON FINDER / LIVE VISION</p>
            <h1>كاميرا التتبّع الذكي</h1>
            <p>بث مباشر آمن للبحث عن الأشخاص من تطبيق اللابتوب.</p>
        </div>
        <div class="live-chip"><span class="live-dot"></span>LIVE READY</div>
    </header>
    <section>
        <h2 class="section-heading">اتصال الكاميرا</h2>
        <label for="serverUrl">رابط الخادم الآمن (HTTPS)</label>
        <input id="serverUrl" type="url" placeholder="https://your-service.onrender.com" autocomplete="url">
        <button id="saveServer" class="secondary" type="button">حفظ رابط الخادم والتحقق</button>
        <video id="camera" autoplay playsinline muted></video>
        <button id="toggle">بدء البث المباشر</button>
        <p id="status" role="status" aria-live="polite">جاري فحص صلاحية الكاميرا...</p>
    </section>
</main>
<script>
    const video = document.getElementById("camera");
    const button = document.getElementById("toggle");
    const status = document.getElementById("status");
    const serverInput = document.getElementById("serverUrl");
    const saveServerButton = document.getElementById("saveServer");
    const serverUrlKey = "cameraServerUrl";
    let stream = null;
    let timer = null;
    let sending = false;

    function showStatus(message, kind = "") {
        status.textContent = message;
        status.className = kind;
    }

    serverInput.value = localStorage.getItem(serverUrlKey) || "";
    async function checkServer(serverUrl) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 75000);
        try {
            const response = await fetch(`${serverUrl}/api/status`, {
                cache: "no-store",
                signal: controller.signal
            });
            const contentType = response.headers.get("content-type") || "";
            if (!response.ok || !contentType.includes("application/json")) {
                throw new Error("رابط الخادم لا يعمل. تأكد أنه رابط Render الصحيح.");
            }
            return await response.json();
        } finally {
            clearTimeout(timeout);
        }
    }

    saveServerButton.addEventListener("click", async () => {
        const value = serverInput.value.trim().replace(/\/+$/, "");
        if (!value) {
            localStorage.removeItem(serverUrlKey);
            showStatus("أدخل رابط خادم Python المنشور على HTTPS أولًا.", "error");
            return;
        }
        try {
            const parsed = new URL(value);
            if (parsed.protocol !== "https:") throw new Error("https");
            saveServerButton.disabled = true;
            showStatus("أتحقق من رابط الخادم وأوقظه إذا كان متوقفًا...", "");
            const health = await checkServer(parsed.origin);
            localStorage.setItem(serverUrlKey, parsed.origin);
            serverInput.value = parsed.origin;
            showStatus(
                `الخادم متصل. عدد الأشخاص الحالي: ${health.people_count}. الآن اضغط بدء البث.`,
                "ready"
            );
        } catch (error) {
            const message = error.name === "AbortError"
                ? "تأخر الخادم في الاستجابة. أعد المحاولة بعد قليل."
                : error.message === "Failed to fetch"
                    ? "تعذر الوصول للخادم. تأكد من كتابة الرابط كاملًا مثل https://person-finding-app.onrender.com"
                    : error.message || "تعذر التحقق من رابط الخادم.";
            showStatus(message, "error");
        } finally {
            saveServerButton.disabled = false;
        }
    });

    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        button.disabled = true;
        showStatus(
            "المتصفح يمنع تشغيل الكاميرا لأن الاتصال الآمن غير موثوق. افتح رابط https على الهاتف، وتأكد من قبول تحذير الشهادة. إذا استمر هذا التنبيه، يلزم شهادة HTTPS موثوقة للهاتف.",
            "error"
        );
    } else {
        showStatus("جاهز. اضغط «بدء البث» واسمح للمتصفح باستخدام الكاميرا.", "ready");
    }

    async function sendFrame() {
        if (!stream || sending || video.videoWidth === 0) return;
        const serverUrl = localStorage.getItem(serverUrlKey);
        if (!serverUrl) {
            showStatus("أدخل رابط خادم Python المنشور واحفظه أولًا.", "error");
            return;
        }
        sending = true;
        try {
            const canvas = document.createElement("canvas");
            canvas.width = Math.min(video.videoWidth, 640);
            canvas.height = Math.round(video.videoHeight * canvas.width / video.videoWidth);
            canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
            const frame = canvas.toDataURL("image/jpeg", 0.55);
            const response = await fetch(`${serverUrl}/upload`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ frame })
            });
            const contentType = response.headers.get("content-type") || "";
            if (!contentType.includes("application/json")) {
                throw new Error("الخادم لم يُرجع JSON. تحقق من رابط خادم Python.");
            }
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "فشل إرسال الصورة.");
            showStatus("البث يعمل. يتم تحليل أحدث صورة في التطبيق.", "ready");
        } catch (error) {
            const message = error.message === "Failed to fetch"
                ? "فشل الاتصال بالخادم. تحقق من رابط الخادم المحفوظ واتصال الإنترنت."
                : `تعذر إرسال البث إلى اللابتوب: ${error.message}`;
            showStatus(message, "error");
        } finally {
            sending = false;
        }
    }

    button.addEventListener("click", async () => {
        if (stream) {
            clearInterval(timer);
            stream.getTracks().forEach(track => track.stop());
            stream = null;
            video.srcObject = null;
            button.textContent = "بدء البث";
            showStatus("البث متوقف.", "");
            return;
        }

        if (!localStorage.getItem(serverUrlKey)) {
            showStatus("أدخل رابط الخادم كاملًا ثم اضغط «حفظ رابط الخادم» أولًا.", "error");
            return;
        }

        button.disabled = true;
        showStatus("جارٍ طلب إذن الكاميرا من المتصفح...", "");
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: "environment" } },
                audio: false
            });
            video.srcObject = stream;
            await video.play();
            button.textContent = "إيقاف البث";
            showStatus("تم فتح الكاميرا. جارٍ إرسال الفيديو إلى اللابتوب...", "ready");
            timer = setInterval(sendFrame, 250);
        } catch (error) {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            const reasons = {
                NotAllowedError: "ارفض المتصفح إذن الكاميرا؛ اضغط رمز القفل بجانب العنوان واسمح بالكاميرا.",
                NotFoundError: "لم يتم العثور على كاميرا في الهاتف.",
                NotReadableError: "الكاميرا مستخدمة من تطبيق آخر. أغلق التطبيق الآخر وحاول مجددًا.",
                SecurityError: "المتصفح منع الكاميرا بسبب شهادة HTTPS أو إعدادات الأمان.",
                TypeError: "رابط الموقع غير آمن أو أن المتصفح لا يدعم الوصول للكاميرا."
            };
            const message = reasons[error.name] || `تعذر فتح الكاميرا (${error.name}): ${error.message}`;
            showStatus(message, "error");
            button.textContent = "إعادة المحاولة";
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
